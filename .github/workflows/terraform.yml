name: Terraform

# Static checks and plan-only tests with mocked providers. No job assumes an AWS role.
# Path filtering happens in the `changes` job: skipped jobs satisfy required checks, while
# workflows skipped by `on.pull_request.paths` leave them pending.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with .devcontainer/devcontainer.json.
  TERRAFORM_VERSION: 1.16.5
  TFLINT_VERSION: v0.64.0
  # Checkov's lock (scripts/checkov/requirements.txt) is resolved for Python 3.12.
  PYTHON_VERSION: "3.12"

jobs:
  changes:
    name: Detect Terraform changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          terraform=true
          if [[ "$EVENT_NAME" == pull_request ]]; then
            # HEAD is the PR merge commit, so HEAD^1 is the base branch.
            changed=$(git diff --name-only HEAD^1 HEAD)
            pattern='^(infra/|\.tflint\.hcl$|Makefile$|\.github/workflows/terraform\.yml$|scripts/checkov/|scripts/testdata/checkov/|scripts/check-terraform-scan\.test\.sh$)'
            if ! grep -qE "$pattern" <<<"$changed"; then
              terraform=false
            fi
          fi
          echo "terraform=$terraform" >> "$GITHUB_OUTPUT"
          echo "Terraform checks required: $terraform" >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Terraform checks
    needs: changes
    # Runs unless detection explicitly reported no Terraform changes, so a detection failure
    # cannot skip the checks.
    if: ${{ always() && needs.changes.outputs.terraform != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: make fmt-terraform

      - name: terraform validate and plan-only tests
        run: make test-terraform

  tflint:
    name: TFLint
    needs: changes
    if: ${{ always() && needs.changes.outputs.terraform != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: TFLint
        env:
          # Avoids GitHub API rate limits when installing the pinned ruleset.
          GITHUB_TOKEN: ${{ github.token }}
        run: make lint-terraform

  scan:
    name: Terraform security scan
    needs: changes
    if: ${{ always() && needs.changes.outputs.terraform != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Install with network access, then scan in an empty network namespace as the runner user.
      - name: Install Checkov
        run: make install-checkov

      - name: Checkov configuration scan
        run: |
          netns="sudo unshare --net -- setpriv --reuid=$(id -u) --regid=$(id -g) --clear-groups"
          # The sandbox must see only the loopback interface; an empty result (sandbox failed) also fails.
          # shellcheck disable=SC2016 # The awk program is intentionally single-quoted.
          ifaces=$($netns awk 'NR > 2 { sub(":", "", $1); print $1 }' /proc/net/dev || true)
          if [[ "$ifaces" != lo ]]; then
            echo "::error::scan sandbox interfaces are '${ifaces//$'\n'/ }', expected only 'lo'"; exit 1
          fi
          # The sandbox itself must have no network, or the scan is not isolated.
          if $netns python3 -c 'import socket; socket.create_connection(("1.1.1.1", 53), 3)' 2>/dev/null; then
            echo "::error::scan sandbox has network access"; exit 1
          fi
          # Fixture test first, then infra/. No AWS credentials exist in this workflow.
          make scan-terraform CHECKOV_NETNS="$netns"
