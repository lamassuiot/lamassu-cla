name: CI

# PR-title lint, release, and Scorecard stay separate: they need other triggers or permissions.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-template:
    name: Validate repository template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install validation tools
        run: python -m pip install --quiet pyyaml==6.0.3 check-jsonschema==0.38.2

      - name: Validate YAML syntax
        run: |
          python - <<'PYEOF'
          import sys
          import pathlib
          import yaml

          failed = False
          for path in pathlib.Path(".").rglob("*.yml"):
              if ".git" in path.parts:
                  continue
              try:
                  list(yaml.safe_load_all(path.read_text()))
              except yaml.YAMLError as exc:
                  failed = True
                  print(f"::error file={path}::Invalid YAML: {exc}")
          for path in pathlib.Path(".").rglob("*.yaml"):
              if ".git" in path.parts:
                  continue
              try:
                  list(yaml.safe_load_all(path.read_text()))
              except yaml.YAMLError as exc:
                  failed = True
                  print(f"::error file={path}::Invalid YAML: {exc}")
          sys.exit(1 if failed else 0)
          PYEOF

      - name: Validate GitHub configuration schemas
        run: |
          find .github/ISSUE_TEMPLATE -name '*.y*ml' ! -name 'config.y*ml' \
            -exec check-jsonschema --builtin-schema vendor.github-issue-forms {} +
          check-jsonschema --builtin-schema vendor.github-issue-config .github/ISSUE_TEMPLATE/config.yml
          find .github/workflows -name '*.y*ml' \
            -exec check-jsonschema --builtin-schema vendor.github-workflows {} +
          if [ -f .github/dependabot.yml ]; then
            check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml
          fi

      - name: Check required template files exist
        run: |
          required_files=(
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "CODE_OF_CONDUCT.md"
            ".github/CODEOWNERS"
            ".github/pull_request_template.md"
            ".github/ISSUE_TEMPLATE/config.yml"
            ".github/ISSUE_TEMPLATE/bug.yml"
            ".github/ISSUE_TEMPLATE/feature.yml"
            ".github/ISSUE_TEMPLATE/task.yml"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              missing=1
            fi
          done
          exit $missing

      - name: Check blank_issues_enabled is false
        run: |
          if ! grep -q "^blank_issues_enabled: false" .github/ISSUE_TEMPLATE/config.yml; then
            echo "::error file=.github/ISSUE_TEMPLATE/config.yml::blank_issues_enabled must be set to false"
            exit 1
          fi

      - name: Check for unresolved placeholders
        # The template itself legitimately contains placeholders; generated repositories must not.
        if: ${{ !github.event.repository.is_template }}
        run: |
          set -e
          matches=$(grep -RInE '<REPLACE_WITH_[A-Z_]+>' --exclude-dir=.git --exclude=AGENTS.md --exclude=TEMPLATE.md . || true)
          if [ -n "$matches" ]; then
            echo "::error::Unresolved template placeholders found:"
            echo "$matches"
            exit 1
          fi

      - name: Check template-only files were removed
        if: ${{ !github.event.repository.is_template }}
        run: |
          found=0
          for f in TEMPLATE.md scripts/configure-repository.sh; do
            if [ -e "$f" ]; then
              echo "::error file=$f::Template-only file must be deleted after instantiation: $f"
              found=1
            fi
          done
          exit $found

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Lint Markdown
        run: |
          npx --yes markdownlint-cli@0.49.1 "**/*.md" --ignore node_modules --ignore .git

      - name: Scan for likely private URLs or hostnames
        run: |
          set -e
          pattern='(internal\.|intranet\.|localhost:[0-9]|\.corp\.|jira\.internal|confluence\.internal)'
          matches=$(grep -RInE "$pattern" --exclude-dir=.git . || true)
          if [ -n "$matches" ]; then
            echo "::error::Possible private/internal URL reference found:"
            echo "$matches"
            exit 1
          fi

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Requires GitHub Advanced Security on private repositories, so run it only on public ones.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  actions-security:
    name: GitHub Actions security lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan git history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .
