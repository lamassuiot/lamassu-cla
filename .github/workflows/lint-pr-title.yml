name: Lint PR Title

# Enforces Conventional Commits on pull request titles. Pull requests are squash-merged, so the
# PR title becomes the commit subject used by git-cliff.

on:
  # Use pull_request_target so title validation also runs for pull requests from forks.
  # This workflow is read-only and must never check out or execute contributor-controlled code.
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-pr-title:
    name: Validate PR title format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Conventional Commits format
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
