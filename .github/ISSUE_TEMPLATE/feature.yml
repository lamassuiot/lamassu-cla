name: "✨ Feature"
description: Propose a new capability or enhancement.
type: Feature
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature!

        ⚠️ **Do not include credentials, tokens, private keys, customer data, or other confidential information in this issue.**

        Note: Strategic planning and roadmap prioritization are managed centrally. This form is for
        actionable feature work in this repository, not for Strategic Epics.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What problem or opportunity does this feature address? Who is affected?
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Expected value
      description: What value or benefit would this feature deliver?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the outcome you'd like to see, without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: High-level scope
      description: What is in scope at a high level for this feature?
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What is explicitly out of scope for this feature?
    validations:
      required: false
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: What conditions must be met for this feature to be considered complete?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and references
      description: Links to related issues, discussions, or public documentation (public URLs only).
    validations:
      required: false
