version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
    # Deferred upgrades that conflict with the A-13 pins (decisions A-15, A-16, A-17).
    ignore:
      # TypeScript stays on 6.0 until a separate decision changes the A-13 pin.
      - dependency-name: typescript
        versions:
          - ">=6.1.0"
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: gomod
    directory: /services/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      go-modules:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
