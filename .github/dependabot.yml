version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
    # TypeScript upgrades are proposed and tested, but the 6.0.3 pin (A-13) changes only in a
    # reviewed PR (A-21). @types/node majors follow the Node.js 24 runtime (ADR-0007).
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: gomod
    directory: /services/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      go-modules:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Root modules commit provider lock files; reusable modules only declare constraints.
  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/environments/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      terraform-providers:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Hash-locked Checkov for the Terraform security scan (ADR-0012).
  - package-ecosystem: pip
    directory: /scripts/checkov
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      checkov:
        patterns:
          - "*"
