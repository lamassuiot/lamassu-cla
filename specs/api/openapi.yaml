openapi: 3.1.0
info:
  title: Lamassu CLA Management Platform API
  version: 0.1.0
  summary: Contract for the CLA portal, administrative APIs, and webhooks.
  description: |
    Source of truth for the platform API. Conventions are defined in `conventions.md` next to
    this file. Operations are added by feature specifications. Every path is relative to the `/api`
    base that CloudFront routes to API Gateway (D-02): versioned operations live under `/v1`, and
    the GitHub sign-in callback stays unversioned at `/auth/github/callback` because it is the URL
    registered with GitHub.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api
    description: Same origin as the portal, under the `/api` prefix (D-02). Hosts are configured at deployment.
tags:
  - name: health
    description: Operational endpoints.
  - name: public
    description: Public CLA catalogue. No authentication.
  - name: auth
    description: GitHub sign-in and sessions.
  - name: me
    description: Current user, contributor status, and own agreements.
  - name: agreements
    description: Agreements and signing sessions.
  - name: organizations
    description: Organizations, CCLAs, and authorized contributors.
  - name: admin
    description: Maintainer, legal-administrator, and platform-administrator operations.
  - name: webhooks
    description: GitHub and signing-provider webhooks.
security:
  - sessionCookie: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Report service liveness.
      description: Returns liveness only. Never reports dependency details or versions.
      tags:
        - health
      security: []
      responses:
        "200":
          description: Service is live.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/auth/github/start:
    get:
      operationId: startGithubSignIn
      summary: Start GitHub sign-in.
      description: |
        Browser navigation, not an XHR call. Validates `return_to` against the relative-path
        allowlist (falling back to `/`), stores a hashed single-use `state` with a PKCE `S256`
        verifier for 10 minutes, sets the `__Host-cla_oauth` pre-authentication cookie, and
        redirects to GitHub with an explicitly empty `scope` and the registered callback URL. Any
        existing portal session is left untouched (F-07, AC-07-1). While sign-in is disabled by
        configuration, returns 503 with code `SIGN_IN_DISABLED` without contacting GitHub.
      tags:
        - auth
      security: []
      parameters:
        - name: return_to
          in: query
          required: false
          description: Relative portal path to return to after sign-in. Rejected values fall back to `/`.
          schema:
            type: string
            maxLength: 2048
      responses:
        "302":
          description: Redirect to GitHub's authorization page; sets `__Host-cla_oauth`.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Sign-in is disabled (`SIGN_IN_DISABLED`) or the session store is unavailable (`STORE_UNAVAILABLE`).
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/github/callback:
    get:
      operationId: completeGithubSignIn
      summary: Complete GitHub sign-in (registered callback URL).
      description: |
        Browser navigation from GitHub. Unversioned because it is the callback URL registered with
        the OAuth App (D-02). Rejects malformed input, checks the `__Host-cla_oauth` binding,
        consumes `state` atomically, exchanges `code` with the PKCE verifier, verifies that the
        granted scope is empty, extracts only `id` and `login` from `GET /user`, creates or
        refreshes the contributor record, and replaces the session in one transaction with its
        audit event (F-07, main flow steps 4 to 6). Every outcome redirects: success to the
        validated `return_to` with the session cookie, failure or cancellation to the portal's
        sign-in error route with a reason code and no personal data.
      tags:
        - auth
      security: []
      parameters:
        - name: code
          in: query
          required: false
          description: Authorization code from GitHub. Present on success; never logged.
          schema:
            type: string
            maxLength: 256
        - name: state
          in: query
          required: true
          description: The single-use `state` issued by the start operation. Never logged.
          schema:
            type: string
            maxLength: 256
        - name: error
          in: query
          required: false
          description: GitHub error code, for example `access_denied`, when the person declines.
          schema:
            type: string
            maxLength: 128
      responses:
        "302":
          description: Redirect to `return_to` with `__Host-cla_session` set, or to the sign-in error route.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/session:
    get:
      operationId: getSession
      summary: Read the current session.
      description: |
        Returns the signed-in person, the absolute session expiry, and the session's CSRF token.
        Reading the session does not extend its idle expiry (F-07, AC-07-6). A missing, unknown,
        or expired session returns 401 with code `SESSION_REQUIRED` and expires any stale cookie.
      tags:
        - auth
      responses:
        "200":
          description: The current session.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/session/sign-out:
    post:
      operationId: signOut
      summary: End the current session.
      description: |
        Deletes the session and writes the `auth.signed_out` audit event in one transaction, then
        expires the cookie. Idempotent: without a session it still returns 204 and expires any
        cookie. The `Origin` check always applies; a valid session also requires its CSRF token
        (403 with code `CSRF_TOKEN_INVALID` or `ORIGIN_NOT_ALLOWED`). A failed or uncertain
        deletion returns 503 with code `STORE_UNAVAILABLE`, never 204 (F-07, AC-07-8).
      tags:
        - auth
      security:
        - sessionCookie: []
          csrfToken: []
        - {}
      responses:
        "204":
          description: The session, if any, is ended and the cookie expired.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cla_session
      description: Opaque session token set by the API after GitHub sign-in.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with the session cookie on state-changing requests.
    githubWebhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: HMAC-SHA256 of the raw request body using the GitHub App webhook secret.
    signingProviderSignature:
      type: apiKey
      in: header
      name: X-Signing-Provider-Signature
      description: |
        Placeholder for provider-specific callback verification. Each provider adapter documents
        its actual headers in the provider webhook operation.
  headers:
    RequestId:
      description: Correlation ID for the request.
      schema:
        type: string
        maxLength: 64
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
    Location:
      description: Redirect target.
      schema:
        type: string
        maxLength: 2048
    NoStore:
      description: Always `no-store` on session and authentication responses.
      schema:
        type: string
        enum:
          - no-store
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional client-supplied correlation ID (ULID or UUID).
      schema:
        type: string
        pattern: "^[0-9A-Za-z-]{26,36}$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required on POST operations that create resources or start workflows.
      schema:
        type: string
        pattern: "^[0-9A-Za-z-]{26,36}$"
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Entity tag for optimistic concurrency.
      schema:
        type: string
        maxLength: 128
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page.
      schema:
        type: string
        maxLength: 1024
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - OK
    Session:
      type: object
      additionalProperties: false
      description: The signed-in person and session metadata. Never includes the session token.
      required:
        - github_user_id
        - github_login
        - expires_at
        - csrf_token
      properties:
        github_user_id:
          type: string
          pattern: "^[0-9]{1,20}$"
          description: Numeric GitHub user ID, the stable identity (D-29). A string to avoid integer precision loss.
        github_login:
          type: string
          maxLength: 39
          description: Current GitHub login, display only; refreshed on every sign-in.
        expires_at:
          type: string
          format: date-time
          description: Absolute session expiry. Idle expiry is enforced server-side and not exposed.
        csrf_token:
          type: string
          minLength: 43
          maxLength: 64
          description: Session-bound token to send as `X-CSRF-Token` on state-changing requests.
    Problem:
      type: object
      description: RFC 9457 Problem Details with platform extensions.
      required:
        - type
        - title
        - status
        - code
        - request_id
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
          description: Stable machine-readable error code.
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - code
      properties:
        field:
          type: string
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]*$"
    PageInfo:
      type: object
      description: Pagination fields merged into every list response.
      properties:
        next_cursor:
          type: string
          description: Absent on the last page.
  responses:
    BadRequest:
      description: Malformed request or validation failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid session or signature.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated but not permitted.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found or not visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The resource is not in a state that allows the operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: The If-Match entity tag does not match.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    IdempotencyKeyReused:
      description: The idempotency key was used with a different request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: A dependency is unavailable.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
